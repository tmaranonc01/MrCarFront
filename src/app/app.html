<header class="top-toolbar">
  <div class="top-nav-start">
    <a class="nav-btn" routerLink="/">Inicio</a>
    <a class="nav-btn" routerLink="/piezas">Piezas</a>

    <button
      *ngIf="token.isLoggedSignal()"
      type="button"
      class="nav-btn"
      (touchend)="goAutoDouble('/deseos', $event)"
      (click)="goAutoDouble('/deseos', $event)"
    >
      Deseos
    </button>

    <button
      *ngIf="token.isAdminSignal()"
      type="button"
      class="nav-btn"
      (touchend)="goAutoDouble('/admin/coches', $event)"
      (click)="goAutoDouble('/admin/coches', $event)"
    >
      Admin coches
    </button>
    <button
      *ngIf="token.isAdminSignal()"
      type="button"
      class="nav-btn"
      (touchend)="goAutoDouble('/admin/piezas', $event)"
      (click)="goAutoDouble('/admin/piezas', $event)"
    >
      Admin piezas
    </button>
  </div>

  <div class="top-nav-end">
    <ng-container *ngIf="token.isLoggedSignal(); else noLogin">
      <span class="user-email">{{ token.emailSignal() }}</span>
      <p-tag [value]="token.rolSignal() || ''" severity="info"></p-tag>
      <button type="button" class="nav-btn" (click)="logout()">Salir</button>
    </ng-container>

    <ng-template #noLogin>
      <a class="nav-btn nav-btn-outline" routerLink="/login">Login</a>
      <a class="nav-btn nav-btn-outline" routerLink="/registro">Registro</a>
    </ng-template>
  </div>
</header>

<div class="app-content">
  <router-outlet></router-outlet>
</div>
