<p-toolbar>
  <ng-template pTemplate="start">
    <div class="top-nav-start">
      <button type="button" class="nav-btn" routerLink="/">Inicio</button>
      <button type="button" class="nav-btn" routerLink="/piezas">Piezas</button>

      <button
        *ngIf="token.isLoggedSignal()"
        type="button"
        class="nav-btn"
        routerLink="/deseos"
      >
        Deseos
      </button>

      <button
        *ngIf="token.isAdminSignal()"
        type="button"
        class="nav-btn"
        routerLink="/admin/coches"
      >
        Admin coches
      </button>
      <button
        *ngIf="token.isAdminSignal()"
        type="button"
        class="nav-btn"
        routerLink="/admin/piezas"
      >
        Admin piezas
      </button>
    </div>
  </ng-template>

  <ng-template pTemplate="end">
    <div class="top-nav-end">
      <ng-container *ngIf="token.isLoggedSignal(); else noLogin">
        <span class="user-email">{{ token.emailSignal() }}</span>
        <p-tag [value]="token.rolSignal() || ''" severity="info"></p-tag>
        <button type="button" class="nav-btn" (click)="logout()">Salir</button>
      </ng-container>

      <ng-template #noLogin>
        <button type="button" class="nav-btn nav-btn-outline" routerLink="/login">Login</button>
        <button type="button" class="nav-btn nav-btn-outline" routerLink="/registro">Registro</button>
      </ng-template>
    </div>
  </ng-template>
</p-toolbar>

<div class="app-content">
  <router-outlet></router-outlet>
</div>
